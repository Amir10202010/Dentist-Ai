[alembic]
script_location = migrations
prepend_sys_path = src
path_separator = os
# The URL is supplied by migrations/env.py from application settings so there
# is exactly one place that knows how to reach the database.
sqlalchemy.url =

[post_write_hooks]
# Intentionally empty. Formatting generated migrations is handled by
# `make fmt` and the pre-commit hook, which work whether or not the caller
# has the virtualenv on PATH — an alembic post-write hook does not.
hooks =

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
