# Render Blueprint — https://render.com/docs/blueprint-spec
#
# Connect this repository in the Render dashboard ("New" → "Blueprint") and
# Render reads this file: it builds ./Dockerfile, provisions the Postgres
# instance below, wires them together, and redeploys on every push to main.
#
# No secret is stored here. The signing key is generated by Render and the
# database URL is injected from the managed instance, so this file is safe in a
# public repository.

services:
  - type: web
    name: dentist-ai
    runtime: docker
    dockerfilePath: ./Dockerfile
    # Frankfurt is Render's closest region to Central Asia. Changing it after
    # the first deploy means recreating the service, so pick it now.
    region: frankfurt
    # Free instances get no persistent disk and sleep when idle, neither of
    # which this application survives — see the disk below.
    plan: starter
    healthCheckPath: /healthz
    # Migrations run to completion before the new instance takes traffic, so a
    # deploy never serves against a schema it does not expect.
    preDeployCommand: alembic upgrade head
    disk:
      # CBCT volumes are content-addressed on local disk, not in the database.
      # Without a persistent disk every deploy silently discards them and the
      # viewer 404s on scans whose rows still exist.
      #
      # NOTE: the image runs as the non-root `dentist` user (uid 10001). If the
      # first deploy fails writing under this path, the mount was created
      # root-owned — see docs/DEPLOY.md for the one-line fix.
      name: patient-storage
      mountPath: /app/var
      sizeGB: 10
    envVars:
      - key: DENTIST_AI__DATABASE__URL
        fromDatabase:
          name: dentist-ai-db
          property: connectionString
      # Generated once by Render and held in its secret store. Rotating it
      # invalidates every existing session, which is the intended behaviour.
      - key: DENTIST_AI__SECRET_KEY
        generateValue: true
      - key: DENTIST_AI__ENVIRONMENT
        value: production
      # The CBCT pipeline is NumPy-only. Set to `yolo` (and rebuild with
      # --build-arg INSTALL_ML=1) once the panoramic detector's weights are
      # published to object storage; the image deliberately ships without them.
      - key: DENTIST_AI__ML__BACKEND
        value: stub

databases:
  - name: dentist-ai-db
    databaseName: dentist_ai
    user: dentist
    region: frankfurt
    plan: basic-256mb
    postgresMajorVersion: "17"
