name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # The suite runs against the stub detector, so CI never downloads torch.
  DENTIST_AI__ENVIRONMENT: test
  DENTIST_AI__SECRET_KEY: ci-secret-key-that-is-long-enough-for-validation
  DENTIST_AI__ML__BACKEND: stub

jobs:
  backend:
    name: Backend (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint
        run: ruff check .

      - name: Format check
        run: ruff format --check .

      - name: Type check
        run: mypy

      - name: Test
        run: pytest --cov --cov-report=xml --cov-report=term-missing

      - name: Upload coverage
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.xml

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        working-directory: frontend
        run: npm ci --no-audit --no-fund

      - name: Type check
        working-directory: frontend
        run: npm run typecheck

      - name: Build
        working-directory: frontend
        run: npx vite build

      - name: Assert bundle budget
        # The marketing pages must stay light. A regression here is usually an
        # accidental heavyweight import, and it should fail loudly.
        run: |
          python3 - <<'PY'
          import json, pathlib, sys
          dist = pathlib.Path("src/dentist_ai/static/dist")
          manifest = json.loads((dist / ".vite" / "manifest.json").read_text())

          BUDGETS_KB = {"src/entries/marketing.ts": 40, "src/entries/auth.ts": 60}
          failed = False
          for entry, budget in BUDGETS_KB.items():
              chunk = manifest[entry]
              files = [chunk["file"], *chunk.get("css", [])]
              total = sum((dist / f).stat().st_size for f in files) / 1024
              status = "ok" if total <= budget else "OVER"
              print(f"{entry}: {total:.1f} KB / {budget} KB {status}")
              failed |= total > budget
          sys.exit(1 if failed else 0)
          PY

      - name: Assert every entry ships styles
        # The backend's equivalent test needs a built dist/, which is
        # gitignored and so absent in the backend job. The invariant is the
        # one that already shipped an unstyled site once: an entry whose CSS
        # arrives only through a transitive import must still resolve to a
        # stylesheet.
        run: |
          python3 - <<'PY'
          import json, pathlib, sys
          manifest = json.loads(
              pathlib.Path("src/dentist_ai/static/dist/.vite/manifest.json").read_text()
          )

          def stylesheets(key, seen=None):
              seen = set() if seen is None else seen
              if key in seen:
                  return []
              seen.add(key)
              found = list(manifest[key].get("css", []))
              for imported in manifest[key].get("imports", []):
                  found += stylesheets(imported, seen)
              return found

          entries = [k for k, v in manifest.items() if v.get("isEntry")]
          if not entries:
              sys.exit("manifest declares no entries")

          failed = False
          for entry in entries:
              found = stylesheets(entry)
              print(f"{entry}: {len(found)} stylesheet(s)")
              failed |= not found
          sys.exit(1 if failed else 0)
          PY

  postgres:
    name: Postgres integration
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: dentist
          POSTGRES_PASSWORD: dentist
          POSTGRES_DB: dentist_ai_test
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
        ports:
          - 5432:5432

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Migrate against Postgres
        # SQLite tolerates schema mistakes that Postgres rejects. Running the
        # real migrations here catches those before a deploy does.
        env:
          DENTIST_AI__DATABASE__URL: postgresql+asyncpg://dentist:dentist@localhost:5432/dentist_ai_test
        run: |
          alembic upgrade head
          alembic downgrade base
          alembic upgrade head

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: dentist-ai:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke test
        run: |
          docker run -d --name app -p 8000:8000 \
            -e DENTIST_AI__SECRET_KEY=ci-secret-key-that-is-long-enough-ok \
            -e DENTIST_AI__DATABASE__URL=sqlite+aiosqlite:///./var/ci.sqlite3 \
            -e DENTIST_AI__SECURITY__TRUSTED_HOSTS='["*"]' \
            dentist-ai:ci
          for _ in $(seq 1 30); do
            if curl -fsS http://localhost:8000/healthz; then echo " ✓ healthy"; exit 0; fi
            sleep 2
          done
          echo "container never became healthy"; docker logs app; exit 1
