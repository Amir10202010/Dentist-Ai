[project]
name = "dentist-ai"
version = "1.0.0"
description = "AI-assisted analysis of dental radiographs for clinics."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Proprietary" }

dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy[asyncio]>=2.0.36",
    "alembic>=1.14",
    "asyncpg>=0.30",
    "aiosqlite>=0.20",
    "greenlet>=3.1",
    "pydantic>=2.10",
    "pydantic-settings>=2.7",
    "email-validator>=2.2",
    "argon2-cffi>=23.1",
    "itsdangerous>=2.2",
    "jinja2>=3.1.5",
    "python-multipart>=0.0.20",
    "pillow>=11.0",
    "numpy>=1.26",
    "structlog>=24.4",
]

[project.optional-dependencies]
# Heavy CV stack. The application runs without it using the stub detector,
# which keeps CI and local web work fast (see DENTIST_AI__ML__BACKEND).
ml = [
    "ultralytics>=8.3",
    "torch>=2.5",
    "torchvision>=0.20",
]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
    "pytest-cov>=6.0",
    "httpx>=0.28",
    "ruff>=0.9",
    "mypy>=1.14",
    "types-pillow>=10.2",
]

[project.scripts]
dentist-ai = "dentist_ai.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dentist_ai"]

# ---------------------------------------------------------------------------
# Ruff — linting + formatting
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "W",    # pycodestyle
    "F",         # pyflakes
    "I",         # isort
    "N",         # pep8-naming
    "UP",        # pyupgrade
    "B",         # bugbear
    "A",         # builtins shadowing
    "C4",        # comprehensions
    "DTZ",       # naive datetimes
    "T20",       # print statements
    "PT",        # pytest style
    "RET",       # return simplification
    "SIM",       # simplify
    "TID",       # tidy imports
    "PTH",       # use pathlib
    "ERA",       # commented-out code
    "PL",        # pylint
    "RUF",       # ruff-specific
    "S",         # bandit
    "ASYNC",     # async correctness
    "ANN401",    # no explicit `Any` in annotations (see the mypy note below)
]
ignore = [
    "S101",      # assert — used deliberately in tests and invariants
    # FastAPI handlers take their dependencies as parameters; splitting them
    # to satisfy an arity rule would obscure the injection, not clarify it.
    "PLR0913",
    "PLR0917",
    # The product ships a Russian-language interface. These rules flag every
    # Cyrillic character that resembles a Latin one, which is every string we
    # write, and would drown out real findings.
    "RUF001",
    "RUF002",
    "RUF003",
]

[tool.ruff.lint.per-file-ignores]
# Tests inspect decoded JSON, which is genuinely dynamic; `Any` is the
# honest annotation there rather than a fiction of precision.
"tests/*" = ["S105", "S106", "PLR2004", "PLC0415", "ANN401"]
# The analysis stages are a table of clinical decision thresholds — lesion
# volumes in mm3, enclosure fractions, Hounsfield bounds. Each literal is
# already documented by the comment above it and named by the rule it sits in;
# lifting 90 of them to module constants would put the rule and its threshold
# on different screens, which is the opposite of auditable.
"src/dentist_ai/ml/stages/*" = ["PLR2004"]
# Autogenerated by `alembic revision --autogenerate`; not hand-maintained.
# A migration that creates thirteen tables is one long statement list by
# nature, so the length rules do not apply to it.
"migrations/versions/*" = ["ERA001", "E501", "PLR0915"]
"migrations/env.py" = ["PLW0108"]
# Operator-facing CLI scripts: printing to the terminal is the interface.
"scripts/*" = ["S311", "PLR2004", "E501", "T201"]
"training/*" = ["T201", "PLR2004", "S311"]

[tool.ruff.lint.isort]
known-first-party = ["dentist_ai"]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "parents"

# ---------------------------------------------------------------------------
# Mypy — strict
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
warn_no_return = true
disallow_any_generics = true
show_error_codes = true
# `disallow_any_explicit` is deliberately off: Pydantic's mypy plugin
# synthesises `__init__` signatures containing `Any` and attributes them to our
# class definitions, so it fires on code we did not write and cannot change.
# Explicit `Any` in our own annotations is banned by ruff's ANN401 instead.
plugins = ["pydantic.mypy"]
files = ["src", "tests"]
exclude = ["^training/"]

[[tool.mypy.overrides]]
module = ["ultralytics.*", "torch.*", "argon2.*"]
ignore_missing_imports = true

# ---------------------------------------------------------------------------
# Pytest
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
addopts = "-q --strict-markers --strict-config"
filterwarnings = ["error", "ignore::DeprecationWarning:passlib.*"]

[tool.coverage.run]
source = ["src/dentist_ai"]
omit = ["*/ml/yolo.py"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "@overload",
]
