<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>{% block title %}Дашборд{% endblock %}</title>

  <!-- локальные CSS -->
  <link rel="stylesheet" href="{{ url_for('static', filename='css/bar.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/home.css') }}">

  <!-- FullCalendar CSS -->
  <link href="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.8/index.global.min.css" rel="stylesheet">

  <style>
    /* небольшой хелпер для контейнера в базовом шаблоне */
    .app { min-height: 100vh; }
  </style>
</head>
<body>
<div class="layout-container" id="layoutContainer">

  <!-- SIDEBAR -->
  <aside class="sidebar" id="sidebar" aria-label="Основная навигация">
      <div class="profile-sidebar">
          <div class="avatar">👤</div>
          <div class="brand-text">
              <h1>Клиника</h1>
              <p class="small">Панель управления</p>
          </div>
      </div>

      <nav class="nav" role="navigation" aria-label="Главное меню">
          <a class="active" href="{{ url_for('home') }}">Обзор</a>
          <!-- используем простые пути, чтобы шаблон рендерился даже без маршрутов -->
          <a href="/patients">Пациенты</a>
          <a href="/calendar">Календарь</a>
          <a href="/analytics">Аналитика</a>
          <a href="/settings">Настройки</a>
      </nav>
  </aside>

  <!-- RIGHT PANEL -->
  <div class="right-panel">

      <!-- TOPBAR -->
      <header class="topbar" role="banner">
          <div class="topbar-left">
            <button id="mobileMenuBtn" class="mobile-menu-btn" aria-label="Открыть меню">☰</button>
            <div class="search" role="search">
                <input placeholder="Поиск по пациентам, записям..." id="searchInput" aria-label="Поиск">
            </div>
          </div>

          <div class="topbar-actions">
              <button class="btn secondary" id="uploadBtn" aria-label="Загрузить">📤 Загрузить</button>
              <button class="btn" id="runAi" aria-label="Запустить AI">🦷 Запустить AI</button>
          </div>
      </header>

      <!-- PAGE CONTENT -->
      <div class="page-content" id="pageContent">
          {% block content %}{% endblock %}
      </div>
  </div>

</div>

<!-- Библиотеки -->
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.3.0/dist/chart.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.8/index.global.min.js"></script>

<!-- общий скрипт (если нужен) -->
<script src="{{ url_for('static', filename='js/home.js') }}"></script>
</body>
</html>
