<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Вход</title>

  <link rel="icon" type="image/x-icon" href="{{ url_for('static', filename='images/favicon.ico') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/header.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/footer.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/login.css') }}">
</head>
<body>

  {% include 'header.html' %}

  <main class="login-page">
    <section class="login-section">
      <div class="login-container">
        <h1>Войти в аккаунт</h1>
        <p>Добро пожаловать обратно! Пожалуйста, введите свои данные для входа</p>
        <form class="login-form" id="loginForm" action="/login" method="POST" novalidate>
          <div class="form-group">
            <label for="email">Email</label>
            <input type="text" id="email" name="email" placeholder="example@mail.com">
          </div>

          <div class="form-group">
            <label for="password">Пароль</label>
            <input type="password" id="password" name="password" placeholder="Введите пароль">
          </div>

          <button type="submit" class="btn-primary">Войти</button>
        </form>

        <p class="register-link">
          Нет аккаунта? <a href="/register">Зарегистрироваться</a>
        </p>
      </div>
    </section>
  </main>

  {% include 'footer.html' %}

  <!-- Контейнер для тостов -->
  <div class="toast-container"></div>

  <script src="{{ url_for('static', filename='js/header.js') }}"></script>
  <script src="{{ url_for('static', filename='js/login.js') }}"></script>
</body>
</html>
