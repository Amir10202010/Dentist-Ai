<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Регистрация</title>

  <link rel="icon" type="image/x-icon" href="{{ url_for('static', filename='images/favicon.ico') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/header.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/footer.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/register.css') }}">
</head>
<body>

  {% include 'header.html' %}

  <main class="register-page">
    <section class="register-section">
      <div class="register-container">
        <h1>Создать аккаунт</h1>
        <p>Присоединяйтесь к Dentist-AI и автоматизируйте управление вашей клиникой</p>
        <form class="register-form" id="registerForm" action="/register" method="POST" novalidate>
          <div class="form-group">
            <label for="name">Имя</label>
            <input type="text" id="name" name="name" placeholder="Ваше имя">
          </div>

          <div class="form-group">
            <label for="email">Email</label>
            <input type="text" id="email" name="email" placeholder="example@mail.com">
          </div>

          <div class="form-group">
            <label for="password">Пароль</label>
            <input type="password" id="password" name="password" placeholder="Введите пароль">
          </div>

          <div class="form-group">
            <label for="confirm_password">Подтвердите пароль</label>
            <input type="password" id="confirm_password" name="confirm_password" placeholder="Повторите пароль">
          </div>

          <button type="submit" class="btn-primary">Зарегистрироваться</button>
        </form>


        <p class="login-link">
          Уже есть аккаунт? <a href="/login">Войти</a>
        </p>
      </div>
    </section>
  </main>

  {% include 'footer.html' %}

  <!-- Контейнер для тостов -->
  <div class="toast-container"></div>

  <script src="{{ url_for('static', filename='js/header.js') }}"></script>
  <script src="{{ url_for('static', filename='js/register.js') }}"></script>
</body>
</html>
